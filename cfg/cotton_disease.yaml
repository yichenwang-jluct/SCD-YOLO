# Cotton leaf disease dataset (6 classes) used in SCD-YOLO
# ---------------------------------------------------------------------------
# 4,173 images / 6,012 instances, split 8:1:1 into 3,338 / 417 / 418 images.
# Composition:
#   - 3,746 images curated from a public Roboflow Universe dataset (CC BY 4.0)
#   - 427 images collected and annotated in the field by the authors
# See the Data Availability statement of the paper for the download link.
#
# Expected layout under `path`:
#   images/{train,val,test}/*.jpg
#   labels/{train,val,test}/*.txt      (YOLO format)
# ---------------------------------------------------------------------------

path: <PATH_TO_DATASET>          # dataset root
train: images/train
val: images/val
test: images/test

nc: 6
# Class order is load-bearing: it indexes class_u in the Cotton-IoU loss.
names: ['blight', 'curl', 'grey_mildew', 'healthy', 'leaf_spot', 'wilt']
