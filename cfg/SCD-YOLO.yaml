# SCD-YOLO : Star-based Cotton Disease detection YOLO
# ===========================================================================
# Baseline: YOLOv13n.  Four contributions, three of which live in this file:
#   #1 Cotton-StarNet  -> backbone, line 0            (cotton_starnet_s050)
#   #2 Star-ADown      -> neck downsampling, lines 23 / 27  (StarADown)
#   #3 Cotton-SimAM    -> the three detection branches, lines 31-33
#                         args = [lambda_param, kernel_size, gamma]
#                              = [0.0001, 3, 0.5]; gamma=0 recovers SimAM exactly
#   #4 Cotton-IoU      -> injected by the training script, not by this YAML
#                         (see scripts/train_adaptive.py)
#
# `nc: 80` below is a placeholder; Ultralytics overrides it from the dataset
# YAML (nc: 6 for the cotton dataset).
#
# Ablation (Tables 4 and 5 of the paper): see docs/REPRODUCE.md for which line
# to change for each row.
# ===========================================================================

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, cotton_starnet_s050, []]   # 0-4   Cotton-StarNet (replaces starnet_s050)
  - [2, 1, Conv, [512,  1, 1]]         # 5
  - [3, 1, Conv, [512,  1, 1]]         # 6
  - [4, 1, Conv, [1024, 1, 1]]         # 7

head:
  - [[5, 6, 7], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]]  # 8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [8, 1, DownsampleConv, []]                   # 10
  - [[6, 8],  1, FullPAD_Tunnel, []]             # 11
  - [[5, 9],  1, FullPAD_Tunnel, []]             # 12
  - [[7, 10], 1, FullPAD_Tunnel, []]             # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 11], 1, Concat, [1]]                   # 15
  - [-1, 2, DSC3k2, [512, True]]                 # 16
  - [[-1, 8], 1, FullPAD_Tunnel, []]             # 17

  - [16, 1, nn.Upsample, [None, 2, "nearest"]]   # 18
  - [[-1, 12], 1, Concat, [1]]                   # 19
  - [-1, 2, DSC3k2, [256, True]]                 # 20
  - [9, 1, Conv, [256, 1, 1]]                    # 21
  - [[20, 21], 1, FullPAD_Tunnel, []]            # 22  -> P3 branch

  - [-1, 1, StarADown, [256]]                    # 23  Star-ADown (replaces ADown)
  - [[-1, 17], 1, Concat, [1]]                   # 24
  - [-1, 2, DSC3k2, [512, True]]                 # 25
  - [[-1, 8], 1, FullPAD_Tunnel, []]             # 26  -> P4 branch

  - [25, 1, StarADown, [512]]                    # 27  Star-ADown (replaces ADown)
  - [[-1, 13], 1, Concat, [1]]                   # 28
  - [-1, 2, DSC3k2, [1024, True]]                # 29
  - [[-1, 10], 1, FullPAD_Tunnel, []]            # 30  -> P5 branch

  # ====== Cotton-SimAM on the three detection branches (zero parameters) ======
  # gamma = 0.5 : spatial-coherence strength; gamma = 0.0 recovers SimAM exactly.
  - [22, 1, CottonSimAM, [0.0001, 3, 0.5]]       # 31  Cotton-SimAM on P3 (lambda, kernel, gamma)
  - [26, 1, CottonSimAM, [0.0001, 3, 0.5]]       # 32  Cotton-SimAM on P4
  - [30, 1, CottonSimAM, [0.0001, 3, 0.5]]       # 33  Cotton-SimAM on P5
  - [[31, 32, 33], 1, Detect, [nc]]              # 34  Detect (fed by the three Cotton-SimAM outputs)
