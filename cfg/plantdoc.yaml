# PlantDoc — cross-crop experiment, models retrained on this dataset (Table 13)
# ---------------------------------------------------------------------------
# 2,569 images across 13 crop species. We use the Roboflow YOLOv8 release (v4),
# which is annotated with 30 classes (18 disease + 12 healthy), with its official
# training / validation / test split (2,009 / 314 / 246 images).
#
# The dataset is NOT redistributed here. Download it from the original source
# (Singh et al., 2020, cited in the paper) and point `path` at the extracted folder.
#
# Note: 'Soyabean leaf' and 'Soybean leaf' are two spellings of the same
# species in this release; they are kept as separate classes, as published.
# ---------------------------------------------------------------------------

path: <PATH_TO_PLANTDOC>
train: train/images
val: valid/images
test: test/images

nc: 30
names: ['Apple Scab Leaf', 'Apple leaf', 'Apple rust leaf', 'Bell_pepper leaf spot', 'Bell_pepper leaf', 'Blueberry leaf', 'Cherry leaf', 'Corn Gray leaf spot', 'Corn leaf blight', 'Corn rust leaf', 'Peach leaf', 'Potato leaf early blight', 'Potato leaf late blight', 'Potato leaf', 'Raspberry leaf', 'Soyabean leaf', 'Soybean leaf', 'Squash Powdery mildew leaf', 'Strawberry leaf', 'Tomato Early blight leaf', 'Tomato Septoria leaf spot', 'Tomato leaf bacterial spot', 'Tomato leaf late blight', 'Tomato leaf mosaic virus', 'Tomato leaf yellow virus', 'Tomato leaf', 'Tomato mold leaf', 'Tomato two spotted spider mites leaf', 'grape leaf black rot', 'grape leaf']
